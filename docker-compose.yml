version: '3.8'

# docker-compose.yml - Orchestrating FastAPI, Redis, SQLite DB, Celery worker & Nginx Proxy (T-306)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swing_trading_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/system.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - TELEGRAM_2FA_PIN=${TELEGRAM_2FA_PIN:-1234}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-swing_trading_secret_token}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: swing_trading_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swing_trading_worker
    restart: always
    command: python -c "import time; print('Background worker started...'); time.sleep(86400)"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/system.db
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      - redis
      - web
    networks:
      - trading_network

  nginx:
    image: nginx:alpine
    container_name: swing_trading_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - trading_network

volumes:
  app_data:
  app_logs:
  app_reports:
  redis_data:

networks:
  trading_network:
    driver: bridge
