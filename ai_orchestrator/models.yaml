# ============================================================
# Multi-Provider AI Control Plane — 20+ Model Catalog
# ============================================================
#
# QUICK ACTIVATION GUIDE FOR CODE FIXER & RESEARCH:
#   1. LOCAL (Ollama) is always ON and requires 0 API keys.
#   2. Gemini is ON by default (free API key in environment).
#   3. To activate any of the free cloud models below:
#      - Get a free key from the provider's link.
#      - Run: export PROVIDER_KEY=...
#      - Set `enabled: true` in this file for that model.
# ============================================================

models:

  # ==========================================================
  # TIER 1 — LOCAL ZERO-COST / PRIVATE (Ollama)
  # ==========================================================

  - id: local-qwen-coder
    provider: ollama
    model: ollama/qwen2.5-coder:7b
    role: [coder, fixer, planner, reviewer]
    task_types: [coding, planning, reviewing, private]
    quality: {coding: 0.85, planning: 0.65, reviewing: 0.70, private: 1.00}
    base_quality: 0.75
    priority: 100
    enabled: true
    free: true
    local: true
    private: true
    daily_limit: unlimited
    context_window: 32768
    max_timeout_seconds: 120
    base_url: "http://localhost:11434"

  - id: local-qwen-coder-14b
    provider: ollama
    model: ollama/qwen2.5-coder:14b
    role: [coder, fixer, planner, reviewer]
    task_types: [coding, planning, reviewing, private]
    quality: {coding: 0.92, planning: 0.75, reviewing: 0.82, private: 1.00}
    base_quality: 0.85
    priority: 99
    enabled: false         # run: ollama pull qwen2.5-coder:14b then set enabled: true
    free: true
    local: true
    private: true
    daily_limit: unlimited
    context_window: 32768
    max_timeout_seconds: 180
    base_url: "http://localhost:11434"

  - id: local-deepseek-r1
    provider: ollama
    model: ollama/deepseek-r1:7b
    role: [researcher, planner, reviewer, coder, fixer]
    task_types: [research, planning, coding, private]
    quality: {research: 0.88, planning: 0.82, coding: 0.80, private: 1.00}
    base_quality: 0.82
    priority: 97
    enabled: true          # ← ENABLED (Ollama deepseek-r1:7b downloaded)
    free: true
    local: true
    private: true
    daily_limit: unlimited
    context_window: 32768
    max_timeout_seconds: 180
    base_url: "http://localhost:11434"


